          <text x="130" y="205" text-anchor="middle" font-size="37" font-weight="1000" fill="url(#label)" letter-spacing="-2">ENERGY</text>

        <div class="spark spark-one">✦</div>

    <footer>
      <span>ENERGYX®</span>
      <span>MADE FOR THE DIGITAL AGE</span>
      <span>EST. 2026</span>
